# Nginx site for ClassroomAI.
# Serves the built React app and forwards /api and /health to the backend on 127.0.0.1:8000.

server {
    listen 80;
    # Replace _ with your domain name (for example classroom.example.com) once you have one.
    server_name _;

    # Paths assume the repo is at /home/ubuntu/classroom_ai. Change them if yours differ.
    root /home/ubuntu/classroom_ai/frontend/dist;
    index index.html;

    # PDFs can be up to 40 MB, so allow a little more than that.
    client_max_body_size 60M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lesson videos, narrated overviews, and slide decks can take several minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # Single-page app: unknown paths return index.html so the React app handles them.
    location / {
        try_files $uri /index.html;
    }
}
